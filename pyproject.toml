[project]
name = "incident-pipeline"
version = "0.1.0"
description = "Turn a batch of incident reports into a shared schema, structured records and a comparison table, using a local model."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ollama>=0.4",
    "pydantic>=2.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
parse = ["unstructured[pdf,docx,md]"]
docling = ["docling"]
dev = ["pytest>=8"]

[project.scripts]
incident-pipeline = "incident_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["incident_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
